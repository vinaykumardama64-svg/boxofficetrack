name: FilmInformation Weekly Update

on:
  schedule:
    - cron: "0 18 * * 0"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Create output folder
        run: |
          mkdir -p output

      - name: Run scraper and sync to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_TABLE: film_collection_wide
        run: |
          python automation/film_info_scraper.py \
            --from 2021-12-10 \
            --to today \
            --out-dir output \
            --out-prefix weekly_all \
            --max-weeks 20

      - name: Upload CSV backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-film-collections
          path: output/
          retention-days: 30
